<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金金哥攪珠機</title>
<link rel="apple-touch-icon" href="marksix-icon2.png">
<link rel="icon" type="image/png" href="marksix-icon2.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="金金哥攪珠機">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0C1E3C">
<style>
  :root {
    --navy-1: #16345F;
    --navy-2: #0C1E3C;
    --gold-1: #F6E27A;
    --gold-2: #D9B84A;
    --gold-3: #A8842C;
    --gold-text: #E8C766;
    --white: #FFFFFF;
    --text-2: rgba(255,255,255,0.65);
    --red: #DF4A42;
    --blue: #2F7BD9;
    --green: #3FA36B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "PingFang HK", "Microsoft JhengHei", sans-serif;
    background: radial-gradient(ellipse at 50% 0%, var(--navy-1), var(--navy-2) 75%);
    background-attachment: fixed;
    color: var(--white);
    display: flex;
    justify-content: center;
    padding: 40px 24px 56px;
    min-height: 100vh;
  }
  main { width: 100%; max-width: 480px; }

  /* ---- Header ---- */
  header { text-align: center; margin-bottom: 28px; }
  h1 {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 0.06em;
    background: linear-gradient(180deg, var(--gold-1) 10%, var(--gold-2) 55%, var(--gold-3) 95%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .stars { color: var(--gold-text); font-size: 14px; letter-spacing: 0.5em; margin-bottom: 6px; padding-left: 0.5em; }
  .subtitle { color: var(--text-2); font-size: 14px; margin-top: 8px; }

  /* ---- Machine ---- */
  .machine { display: flex; flex-direction: column; align-items: center; }

  .globe-ring {
    position: relative;
    z-index: 1;
    border-radius: 50%;
    padding: 10px;
    background: linear-gradient(145deg, var(--gold-1) 0%, var(--gold-3) 28%, var(--gold-1) 52%, var(--gold-3) 78%, var(--gold-1) 100%);
    box-shadow: 0 12px 32px rgba(0,0,0,0.45), 0 0 40px rgba(217,184,74,0.18);
  }
  .globe {
    width: 292px;
    height: 292px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 26%, #FFFFFF 0%, #F5F2E9 52%, #E7E2D2 100%);
    box-shadow: inset 0 -14px 28px rgba(120,100,40,0.18), inset 0 8px 18px rgba(255,255,255,0.9);
    position: relative;
    overflow: hidden;
  }
  .globe::after { /* glass shine above the balls */
    content: "";
    position: absolute;
    z-index: 2;
    top: 7%;
    left: 14%;
    width: 42%;
    height: 24%;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.85), rgba(255,255,255,0) 70%);
    pointer-events: none;
  }

  .tumbler { position: absolute; inset: 0; z-index: 1; }
  canvas.tumbler { width: 100%; height: 100%; display: block; }

  /* official Mark Six ball colours, shared by all ball sizes */
  .c-red   { background: radial-gradient(circle at 34% 28%, #F08378, var(--red) 58%, #B23027); }
  .c-blue  { background: radial-gradient(circle at 34% 28%, #7FB0EC, var(--blue) 58%, #1D5BAD); }
  .c-green { background: radial-gradient(circle at 34% 28%, #7CCBA0, var(--green) 58%, #2A7A4E); }

  /* machine base */
  .base {
    margin-top: -18px;
    width: 230px;
    padding: 10px 0 12px;
    border-radius: 8px;
    background: linear-gradient(180deg, var(--gold-1), var(--gold-2) 45%, var(--gold-3));
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    text-align: center;
    z-index: 0;
  }
  .base span {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.32em;
    padding-left: 0.32em;
    color: var(--navy-2);
  }

  /* ---- Result track ---- */
  .track {
    margin-top: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    min-height: 48px;
  }
  .slot {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1.5px dashed rgba(217,184,74,0.4);
    background: rgba(255,255,255,0.05);
  }
  .ball {
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: #FFFFFF;
    text-shadow: 0 1px 2px rgba(0,0,0,0.35);
    box-shadow: inset 0 -6px 10px rgba(0,0,0,0.22), inset 0 4px 8px rgba(255,255,255,0.35), 0 3px 6px rgba(0,0,0,0.18);
  }
  .r-ball { width: 42px; height: 42px; font-size: 15px; }
  .track .plus { font-size: 20px; color: var(--gold-text); margin: 0 2px; }
  .ball.special { outline: 3px solid var(--gold-2); outline-offset: 3px; }

  @media (prefers-reduced-motion: no-preference) {
    .ball.pop { animation: pop 0.32s ease-out; }
    @keyframes pop {
      0% { transform: scale(0.4); }
      60% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    .ball.grand { animation: grandPop 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.2), glowPulse 1.1s ease-out; }
    @keyframes grandPop {
      0% { transform: scale(0.3); }
      55% { transform: scale(1.22); }
      100% { transform: scale(1); }
    }
    @keyframes glowPulse {
      0% { box-shadow: 0 0 0 0 rgba(217,184,74,0.75), inset 0 -6px 10px rgba(0,0,0,0.22), inset 0 4px 8px rgba(255,255,255,0.35); }
      100% { box-shadow: 0 0 0 28px rgba(217,184,74,0), inset 0 -6px 10px rgba(0,0,0,0.22), inset 0 4px 8px rgba(255,255,255,0.35); }
    }
  }

  /* ---- Draw button ---- */
  #drawBtn {
    margin-top: 26px;
    width: 100%;
    padding: 15px 24px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.2em;
    padding-left: calc(24px + 0.2em);
    color: var(--navy-2);
    background: linear-gradient(180deg, var(--gold-1), var(--gold-2) 55%, var(--gold-3));
    border: none;
    border-radius: 10px;
    cursor: pointer;
    min-height: 52px;
    box-shadow: 0 6px 18px rgba(217,184,74,0.35), inset 0 1px 0 rgba(255,255,255,0.55);
  }
  #drawBtn:hover { filter: brightness(1.06); }
  #drawBtn:active { filter: brightness(0.94); }
  #drawBtn:disabled { opacity: 0.55; cursor: default; }
  #drawBtn:focus-visible { outline: 3px solid var(--gold-1); outline-offset: 3px; }

  /* ---- History ---- */
  .history { margin-top: 36px; }
  .history h2 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--gold-text);
    margin-bottom: 12px;
    text-align: center;
  }
  .history-row {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 10px 12px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(217,184,74,0.22);
    border-radius: 10px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .history-row .idx {
    font-family: Georgia, serif;
    font-size: 13px;
    color: var(--gold-text);
    min-width: 30px;
  }
  .mini-ball {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: #FFFFFF;
    text-shadow: 0 1px 1px rgba(0,0,0,0.3);
  }
  .mini-ball.c-red   { background: var(--red); }
  .mini-ball.c-blue  { background: var(--blue); }
  .mini-ball.c-green { background: var(--green); }
  .mini-ball.special { outline: 2px solid var(--gold-2); outline-offset: 2px; }
  .history-row .plus { font-size: 15px; color: var(--gold-text); }

  footer {
    margin-top: 40px;
    text-align: center;
    font-family: Georgia, serif;
    font-size: 12px;
    letter-spacing: 0.3em;
    padding-left: 0.3em;
    color: rgba(232,199,102,0.55);
  }

  #version {
    position: fixed;
    right: 12px;
    bottom: 10px;
    z-index: 10;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: rgba(232,199,102,0.45);
    pointer-events: none;
  }

  @media (max-width: 420px) {
    .slot { width: 36px; height: 36px; }
    .r-ball { width: 36px; height: 36px; font-size: 13px; }
    .track { gap: 6px; }
  }
  @media (max-width: 360px) {
    .globe { width: 250px; height: 250px; }
    .track { gap: 4px; }
    .slot, .r-ball { width: 32px; height: 32px; }
    .r-ball { font-size: 12px; }
    .track .plus { font-size: 17px; margin: 0; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="stars">★ ★ ★</div>
    <h1>金金哥攪珠機</h1>
    <p class="subtitle">1–49 隨機抽出 7 個不重複號碼</p>
  </header>

  <section class="machine" aria-live="polite">
    <div class="globe-ring">
      <div class="globe">
        <canvas class="tumbler" id="tumblerCanvas"></canvas>
      </div>
    </div>
    <div class="base"><span>MARK SIX</span></div>

    <div class="track" id="track"></div>

    <button id="drawBtn">攪 珠</button>
  </section>

  <section class="history" id="historySection" hidden>
    <h2>— 過往結果 —</h2>
    <div id="historyList"></div>
  </section>

  <footer>★ MARK SIX ★</footer>
  <div id="version" aria-hidden="true"></div>
</main>

<script>
  // Mark Six numbers and official colour groups
  const RED = new Set([1,2,7,8,12,13,18,19,23,24,29,30,34,35,40,45,46]);
  const BLUE = new Set([3,4,9,10,14,15,20,25,26,31,36,37,41,42,47,48]);
  function ballColor(n) {
    if (RED.has(n)) return "c-red";
    if (BLUE.has(n)) return "c-blue";
    return "c-green";
  }

  const VERSION = "1.2.0";
  document.getElementById("version").textContent = "v" + VERSION;

  const globe = document.querySelector(".globe");
  const canvas = document.getElementById("tumblerCanvas");
  const ctx = canvas.getContext("2d");
  const track = document.getElementById("track");
  const drawBtn = document.getElementById("drawBtn");
  const historySection = document.getElementById("historySection");
  const historyList = document.getElementById("historyList");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // A settled, non-overlapping pile, generated with the same low-bounce
  // contact model used while the machine is running. Coordinates are relative
  // to the centre of a 292px globe.
  const REST_OFFSETS = [
    [0.17,126],[-25.69,123.35],[-10.48,102.27],[26.03,123.28],[-50.46,115.45],
    [15.38,99.56],[0.12,78.51],[-73.09,102.64],[-35.25,94.37],[-24.66,70.62],
    [50.78,115.31],[40.13,91.59],[-5.44,53.1],[-92.6,85.45],[24.87,70.54],
    [19.31,45.14],[-57.87,81.55],[-47.28,57.8],[73.37,102.43],[-28.07,40.29],
    [0.05,27.68],[92.84,85.19],[62.72,78.71],[82.18,61.47],[47.46,57.66],
    [66.92,40.41],[41.92,32.26],[22.64,14.81],[-77.38,64.36],[-22.58,14.87],
    [-0.17,1.68],[-66.8,40.61],[-47.58,23.1],[-42.12,-2.32],[-19.7,-15.49],
    [61.37,15],[42.09,-2.45],[19.5,-15.32],[-0.03,-32.49],[108.35,64.32],
    [97.72,40.59],[-108.17,64.62],[-92.96,43.53],[-82.39,19.77],[-68.12,-1.96],
    [87.31,16.76],[-55.45,-24.67],[75.88,-6.59],[-33.02,-37.82]
  ];

  const FIXED_DT = 1 / 90; // fine-grained enough for stable arcs, cheap enough for iPhone
  const REFILL_TIME = 1.82;
  const ROUND_ONE_TIME = 2.4;
  const PAUSE_TIME = 0.45;
  const ROUND_TWO_TIME = 2.5;
  const EXTRACT_GAP = 0.48;
  const BALL_RESTITUTION = 0.22;
  const WALL_RESTITUTION = 0.3;

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const smoothstep = (a, b, x) => {
    const k = clamp((x - a) / (b - a), 0, 1);
    return k * k * (3 - 2 * k);
  };

  function measureWorld() {
    const rect = globe.getBoundingClientRect();
    const scale = rect.width / 292;
    const ballR = 13 * scale;
    return {
      cx: rect.width / 2,
      cy: rect.height / 2,
      scale,
      ballR,
      wallR: Math.min(rect.width, rect.height) / 2 - ballR - 7 * scale,
      gravity: 860 * scale,
      maxSpeed: 1080 * scale
    };
  }

  let world = measureWorld();
  let balls = [];
  let exitingBalls = []; // drawn balls fading down the exit chute
  let phase = "idle"; // idle | refill | roll1 | pause | roll2 | drawing | settling
  let phaseTime = 0;
  let drawCount = 0;
  let busy = false;
  let rafId = 0;
  let lastFrame = 0;
  let lastFrameDt = 0;
  let accumulator = 0;
  let drawResult = [];
  let mainResult = [];
  let specialResult = 0;
  let drawIndex = 0;
  let nextExtractAt = 0;
  let refillQueue = [];
  let nextSpawnAt = 0;
  let startDirection = 1;
  let jetPhase = 0;
  // Sweep-and-prune collision order. The 49 balls stay nearly x-sorted between
  // steps, so an insertion-sort sweep checks only real neighbours instead of
  // all 1,176 pairs — cheap even on old phones.
  const sweepOrder = Array.from({ length: 64 }, (_, i) => i);
  const drawOrder = [];

  // ---- Canvas rendering ----
  // All 49 balls are drawn into ONE canvas. On iPhone Safari this is vastly
  // cheaper than 49 composited DOM layers with gradients and shadows.
  let renderScale = 1;
  let sprites = null; // colour -> offscreen canvas sprite (gradient baked in)

  function makeSprites() {
    const r = world.ballR * renderScale;
    const d = Math.max(2, Math.ceil(r * 2));
    const stops = {
      "c-red":   ["#F08378", "#DF4A42", "#B23027"],
      "c-blue":  ["#7FB0EC", "#2F7BD9", "#1D5BAD"],
      "c-green": ["#7CCBA0", "#3FA36B", "#2A7A4E"]
    };
    sprites = {};
    for (const key of Object.keys(stops)) {
      const c = document.createElement("canvas");
      c.width = c.height = d;
      const g = c.getContext("2d");
      // soft contact shadow baked behind the ball (bottom crescent)
      g.fillStyle = "rgba(0,0,0,0.16)";
      g.beginPath(); g.arc(d / 2, d / 2 + r * 0.1, r, 0, Math.PI * 2); g.fill();
      const grad = g.createRadialGradient(d * 0.34, d * 0.28, r * 0.08, d / 2, d / 2, r);
      grad.addColorStop(0, stops[key][0]);
      grad.addColorStop(0.58, stops[key][1]);
      grad.addColorStop(1, stops[key][2]);
      g.fillStyle = grad;
      g.beginPath(); g.arc(d / 2, d / 2, r * 0.985, 0, Math.PI * 2); g.fill();
      // top highlight
      const hi = g.createRadialGradient(d * 0.34, d * 0.26, 0, d * 0.34, d * 0.26, r * 0.6);
      hi.addColorStop(0, "rgba(255,255,255,0.5)");
      hi.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = hi;
      g.beginPath(); g.arc(d / 2, d / 2, r * 0.985, 0, Math.PI * 2); g.fill();
      sprites[key] = c;
    }
  }

  function setupCanvas() {
    const rect = globe.getBoundingClientRect();
    // Cap at 2x: visually indistinguishable for shaded circles, ~44% fewer
    // pixels than 3x on modern iPhones.
    renderScale = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * renderScale);
    canvas.height = Math.round(rect.height * renderScale);
    makeSprites();
  }

  function drawOne(b) {
    const r = world.ballR;
    ctx.save();
    ctx.translate(b.x, b.y);
    if (b.exit) {
      const k = Math.min(1, b.exit.t / 0.42);
      const e = k * k * (3 - 2 * k);
      ctx.globalAlpha = 1 - e;
      const s = 1 - 0.88 * e;
      ctx.translate((world.cx - b.exit.fx) * e, (world.cy + world.wallR - r * 2.1 - b.exit.fy) * e);
      ctx.scale(s, s);
    }
    ctx.rotate(b.angle);
    const d = r * 2;
    ctx.drawImage(sprites[b.color], -r, -r, d, d);
    ctx.font = "700 " + Math.round(11 * world.scale) + "px -apple-system, 'PingFang HK', Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fillText(b.num, 0, 0.9 * world.scale);
    ctx.fillStyle = "#FFFFFF";
    ctx.fillText(b.num, 0, 0);
    ctx.restore();
  }

  function renderBalls() {
    if (!sprites) return;
    ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
    ctx.clearRect(0, 0, world.cx * 2, world.cy * 2);
    // depth: lower balls (larger y) drawn last
    drawOrder.length = balls.length;
    for (let i = 0; i < balls.length; i++) drawOrder[i] = i;
    for (let i = 1; i < balls.length; i++) {
      const v = drawOrder[i];
      const vy = balls[v].y;
      let j = i - 1;
      while (j >= 0 && balls[drawOrder[j]].y > vy) { drawOrder[j + 1] = drawOrder[j]; j--; }
      drawOrder[j + 1] = v;
    }
    for (let i = 0; i < balls.length; i++) drawOne(balls[drawOrder[i]]);
    for (let i = exitingBalls.length - 1; i >= 0; i--) {
      const b = exitingBalls[i];
      b.exit.t += lastFrameDt;
      if (b.exit.t >= 0.46) { exitingBalls.splice(i, 1); continue; }
      drawOne(b);
    }
  }

  function newBall(num, x, y, sleeping) {
    return { num, color: ballColor(num), x, y, vx: 0, vy: 0, angle: 0, omega: 0, sleepTime: 0, sleeping: Boolean(sleeping) };
  }

  function initTumbler() {
    exitingBalls.length = 0;
    balls = REST_OFFSETS.map(([ox, oy], i) =>
      newBall(i + 1, world.cx + ox * world.scale, world.cy + oy * world.scale, true)
    );
  }

  function rand1to49() { return Math.floor(Math.random() * 49) + 1; }

  function drawSeven() {
    const nums = Array.from({ length: 49 }, (_, i) => i + 1);
    for (let i = nums.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [nums[i], nums[j]] = [nums[j], nums[i]];
    }
    return nums.slice(0, 7);
  }

  function wake(b) {
    if (!b) return;
    b.sleeping = false;
    b.sleepTime = 0;
  }

  function wakeAll() {
    for (const b of balls) wake(b);
  }

  function allAsleep() {
    return balls.every(b => b.sleeping);
  }

  // Jet strength envelope per round: fast ramp-up, full blast, short fade.
  // Direction flips the left-right sway of the nozzles between rounds.
  function currentFlow() {
    if (phase === "roll1") {
      const ramp = smoothstep(0, 0.22, phaseTime);
      const fade = 1 - smoothstep(ROUND_ONE_TIME - 0.3, ROUND_ONE_TIME, phaseTime);
      return { strength: ramp * fade, direction: startDirection };
    }
    if (phase === "roll2") {
      const ramp = smoothstep(0, 0.22, phaseTime);
      const fade = 1 - smoothstep(ROUND_TWO_TIME - 0.3, ROUND_TWO_TIME, phaseTime);
      return { strength: ramp * fade, direction: -startDirection };
    }
    return null;
  }

  // The broadcast machine is an air-mix machine: strong jets at the bottom
  // blast the balls up, gravity pulls them back down, and ball/wall impacts
  // scatter them. Air is applied as a *force* (acceleration), never as a
  // velocity target, so every ball still follows real gravity arcs.
  function jetAcceleration(b, flow) {
    const nx = clamp((b.x - world.cx) / world.wallR, -1.15, 1.15);
    const ny = clamp((b.y - world.cy) / world.wallR, -1.15, 1.15);
    const g = world.gravity;
    const st = flow.strength;

    // Twin bottom jets whose centre sways left<->right across the round,
    // like the alternating nozzles of the real machine.
    const sway = Math.sin(jetPhase * 2.1) * 0.42 * flow.direction;
    const column = Math.exp(-Math.pow((nx - sway) / 0.42, 2));
    const lowZone = smoothstep(-0.3, 0.45, ny);
    const pulse = 0.78 + 0.22 * Math.sin(jetPhase * 11.5);
    let ax = 0;
    let ay = -g * 6.3 * st * column * lowZone * pulse;

    // Near the top the jet spreads outward, so balls fountain over and
    // cascade down the sides instead of hovering.
    const topZone = smoothstep(-0.55, -1.0, ny);
    ax += (nx >= 0 ? 1 : -1) * g * 2.2 * st * topZone * (0.4 + Math.abs(nx));

    // Chaotic per-ball buffeting, smooth over time (no per-frame jitter).
    const seed = b.num * 1.618;
    ax += g * 1.05 * st * Math.sin(jetPhase * 8.1 + seed * 3.1 + ny * 5.0);
    ay += g * 0.75 * st * Math.cos(jetPhase * 6.8 + seed * 2.3 + nx * 4.0);

    // Slight side-wall return so stray balls rejoin the fountain.
    ax += -nx * g * 0.5 * st * smoothstep(0.55, 1.0, Math.abs(nx));
    return { ax, ay };
  }

  function resolveWall(b) {
    if (b.sleeping) return;
    const dx = b.x - world.cx;
    const dy = b.y - world.cy;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d <= world.wallR) return;
    const invD = 1 / Math.max(d, 0.0001);
    const nx = dx * invD;
    const ny = dy * invD;
    b.x = world.cx + nx * world.wallR;
    b.y = world.cy + ny * world.wallR;
    const vn = b.vx * nx + b.vy * ny;
    if (vn > 0) {
      b.vx -= (1 + WALL_RESTITUTION) * vn * nx;
      b.vy -= (1 + WALL_RESTITUTION) * vn * ny;
      const tx = -ny, ty = nx;
      const vt = b.vx * tx + b.vy * ty;
      b.vx -= vt * 0.018 * tx;
      b.vy -= vt * 0.018 * ty;
    }
  }

  function collideSweep() {
    const n = balls.length;
    for (let i = 0; i < n; i++) sweepOrder[i] = i;
    // Insertion sort on x — array is nearly sorted from the previous step.
    for (let i = 1; i < n; i++) {
      const v = sweepOrder[i];
      const vx = balls[v].x;
      let j = i - 1;
      while (j >= 0 && balls[sweepOrder[j]].x > vx) { sweepOrder[j + 1] = sweepOrder[j]; j--; }
      sweepOrder[j + 1] = v;
    }
    const diameter = world.ballR * 2;
    for (let i = 0; i < n; i++) {
      const a = balls[sweepOrder[i]];
      for (let j = i + 1; j < n; j++) {
        const b = balls[sweepOrder[j]];
        if (b.x - a.x >= diameter) break; // x too far apart — no overlap possible
        resolvePair(a, b);
      }
    }
  }

  function resolvePair(a, b) {
    if (a.sleeping && b.sleeping) return;
    let dx = b.x - a.x;
    let dy = b.y - a.y;
    let d2 = dx * dx + dy * dy;
    const diameter = world.ballR * 2;
    if (d2 >= diameter * diameter) return;
    let d = Math.sqrt(Math.max(d2, 1e-10));
    let nx = dx / d, ny = dy / d;
    const penetration = diameter - d;

    if (a.sleeping && (b.vx * b.vx + b.vy * b.vy > 1 || penetration > 0.04 * world.scale)) wake(a);
    if (b.sleeping && (a.vx * a.vx + a.vy * a.vy > 1 || penetration > 0.04 * world.scale)) wake(b);
    if (a.sleeping && b.sleeping) return;

    const invA = a.sleeping ? 0 : 1;
    const invB = b.sleeping ? 0 : 1;
    const invSum = invA + invB;
    if (invSum === 0) return;

    const slop = 0.015 * world.scale;
    if (penetration > slop) {
      const correction = (penetration - slop) * 0.72 / invSum;
      if (invA) { a.x -= nx * correction; a.y -= ny * correction; }
      if (invB) { b.x += nx * correction; b.y += ny * correction; }
    }

    const rvx = b.vx - a.vx;
    const rvy = b.vy - a.vy;
    const vn = rvx * nx + rvy * ny;
    if (vn >= 0) return;
    const impulse = -(1 + BALL_RESTITUTION) * vn / invSum;
    if (invA) { a.vx -= impulse * nx; a.vy -= impulse * ny; }
    if (invB) { b.vx += impulse * nx; b.vy += impulse * ny; }

    // Low tangential friction transfers some spin-like drag without a rubbery bounce.
    const tx = -ny, ty = nx;
    const tangentSpeed = rvx * tx + rvy * ty;
    const jt = clamp(-tangentSpeed / invSum, -impulse * 0.22, impulse * 0.22);
    if (invA) { a.vx -= jt * tx; a.vy -= jt * ty; }
    if (invB) { b.vx += jt * tx; b.vy += jt * ty; }
  }

  function setPhase(next) {
    phase = next;
    phaseTime = 0;
  }

  function beginRoundOne() {
    wakeAll();
    setPhase("roll1");
    drawBtn.textContent = "攪珠中…";
  }

  function beginRoundTwo() {
    wakeAll();
    setPhase("roll2");
    drawBtn.textContent = "第二轉…";
  }

  function spawnRefillBall() {
    if (!refillQueue.length) return;
    const num = refillQueue.shift();
    const order = 7 - refillQueue.length - 1;
    const feedX = [0, -26, 26, -17, 17, -9, 9][order] * world.scale;
    const y = world.cy - world.wallR + 4 * world.scale;
    const b = newBall(num, world.cx + feedX, y, false);
    b.vx = ((order % 2) ? 1 : -1) * 3 * world.scale;
    balls.push(b);
  }

  function startRefill(missing) {
    refillQueue = missing.slice();
    nextSpawnAt = 0;
    setPhase("refill");
    drawBtn.textContent = "補珠中…";
  }

  function startLoop() {
    if (rafId) cancelAnimationFrame(rafId);
    accumulator = 0;
    lastFrame = 0;
    rafId = requestAnimationFrame(tick);
  }

  function clearMotion() {
    for (const b of balls) {
      b.vx = 0;
      b.vy = 0;
      b.omega = 0;
      b.sleepTime = 0;
      b.sleeping = true;
    }
  }

  function fillSlot(i, num) {
    const slot = track.querySelector('[data-i="' + i + '"]');
    if (!slot) return;
    const b = document.createElement("div");
    b.className = "ball r-ball pop " + ballColor(num) + (i === 6 ? " special grand" : "");
    b.textContent = num;
    slot.replaceWith(b);
  }

  function renderTrack() {
    track.replaceChildren();
    for (let i = 0; i < 7; i++) {
      if (i === 6) {
        const p = document.createElement("span");
        p.className = "plus";
        p.textContent = "+";
        track.appendChild(p);
      }
      const s = document.createElement("div");
      s.className = "slot";
      s.dataset.i = i;
      track.appendChild(s);
    }
  }

  function addHistory(main, special) {
    drawCount++;
    historySection.hidden = false;
    const row = document.createElement("div");
    row.className = "history-row";
    const idx = document.createElement("span");
    idx.className = "idx";
    idx.textContent = "#" + drawCount;
    row.appendChild(idx);
    [...main].sort((a, b) => a - b).forEach(n => {
      const m = document.createElement("span");
      m.className = "mini-ball " + ballColor(n);
      m.textContent = n;
      row.appendChild(m);
    });
    const plus = document.createElement("span");
    plus.className = "plus";
    plus.textContent = "+";
    row.appendChild(plus);
    const s = document.createElement("span");
    s.className = "mini-ball special " + ballColor(special);
    s.textContent = special;
    row.appendChild(s);
    historyList.prepend(row);
    while (historyList.children.length > 5) historyList.lastChild.remove();
  }

  function removeDrawnBall(num) {
    const index = balls.findIndex(b => b.num === num);
    if (index < 0) return;
    const b = balls.splice(index, 1)[0];
    b.exit = { t: 0, fx: b.x, fy: b.y };
    exitingBalls.push(b);
  }

  function beginSettling() {
    addHistory(mainResult, specialResult);
    setPhase("settling");
    // The last result is out; keep the physics settling in the background,
    // but make the next draw available immediately.
    busy = false;
    drawBtn.disabled = false;
    drawBtn.textContent = "攪 珠";
  }

  function finishCycle(forceSleep = false) {
    if (forceSleep) clearMotion();
    setPhase("idle");
    busy = false;
    drawBtn.disabled = false;
    drawBtn.textContent = "攪 珠";
  }

  function extractOne() {
    if (drawIndex >= drawResult.length) return;
    const num = drawResult[drawIndex];
    removeDrawnBall(num);
    fillSlot(drawIndex, num);
    drawIndex++;
    if (drawIndex >= drawResult.length) {
      beginSettling();
    } else {
      nextExtractAt += EXTRACT_GAP;
    }
  }

  function updatePhase(dt) {
    phaseTime += dt;
    if (phase === "refill") {
      if (refillQueue.length && phaseTime + 1e-6 >= nextSpawnAt) {
        spawnRefillBall();
        nextSpawnAt += 0.145;
      }
      if (phaseTime >= REFILL_TIME && refillQueue.length === 0) beginRoundOne();
    } else if (phase === "roll1" && phaseTime >= ROUND_ONE_TIME) {
      setPhase("pause");
      drawBtn.textContent = "落珠…";
    } else if (phase === "pause" && phaseTime >= PAUSE_TIME) {
      beginRoundTwo();
    } else if (phase === "roll2" && phaseTime >= ROUND_TWO_TIME) {
      setPhase("drawing");
      drawIndex = 0;
      nextExtractAt = 0.16;
      drawBtn.textContent = "抽出號碼…";
    } else if (phase === "drawing" && phaseTime >= nextExtractAt) {
      extractOne();
    } else if (phase === "settling") {
      if (phaseTime >= 0.38 && allAsleep()) finishCycle();
      else if (phaseTime >= 5.5) finishCycle(true);
    }
  }

  function simulate(dt) {
    const flow = currentFlow();
    const jetsOn = Boolean(flow && flow.strength > 0.002);
    if (jetsOn) jetPhase += dt;

    for (const b of balls) {
      if (b.sleeping) continue;
      // Gravity always acts; during a tumble the jets add blast forces.
      b.vy += world.gravity * dt;
      if (jetsOn) {
        const j = jetAcceleration(b, flow);
        b.vx += j.ax * dt;
        b.vy += j.ay * dt;
        // Lively air: low drag so ricochets stay energetic.
        b.vx *= Math.exp(-0.06 * dt);
        b.vy *= Math.exp(-0.02 * dt);
      } else {
        b.vx *= Math.exp(-0.3 * dt);
        b.vy *= Math.exp(-0.08 * dt);
      }

      const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      if (speed > world.maxSpeed) {
        const f = world.maxSpeed / speed;
        b.vx *= f;
        b.vy *= f;
      }
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      const spinTarget = (b.vx * 0.72 - b.vy * 0.25) / Math.max(world.ballR, 1);
      b.omega += (spinTarget - b.omega) * Math.min(1, 2.8 * dt);
      b.angle += b.omega * dt;
    }

    for (let pass = 0; pass < 2; pass++) {
      for (const b of balls) resolveWall(b);
      collideSweep();
    }

    const canSleep = !jetsOn;
    if (canSleep) {
      const slow = 10 * world.scale;
      for (const b of balls) {
        if (b.sleeping) continue;
        if (b.vx * b.vx + b.vy * b.vy < slow * slow && Math.abs(b.omega) < 1.1) {
          b.sleepTime += dt;
          if (b.sleepTime >= 0.58) {
            b.sleeping = true;
            b.vx = b.vy = b.omega = 0;
          }
        } else {
          b.sleepTime = 0;
        }
      }
    }
    updatePhase(dt);
  }

  function tick(now) {
    if (!lastFrame) lastFrame = now;
    // Cap catch-up work: on a slow frame we simulate at most ~3 steps so the
    // next paint is never delayed (prevents the dropped-frame cascade).
    const elapsed = Math.min(0.034, Math.max(0, (now - lastFrame) / 1000));
    lastFrame = now;
    lastFrameDt = elapsed;
    accumulator += elapsed;
    while (accumulator >= FIXED_DT && phase !== "idle") {
      simulate(FIXED_DT);
      accumulator -= FIXED_DT;
    }
    renderBalls();
    if (phase !== "idle" || exitingBalls.length) {
      rafId = requestAnimationFrame(tick);
    } else {
      rafId = 0;
      lastFrame = 0;
      accumulator = 0;
    }
  }

  function completeWithoutMotion() {
    exitingBalls.length = 0;
    for (const num of drawResult) {
      const index = balls.findIndex(b => b.num === num);
      if (index >= 0) balls.splice(index, 1);
    }
    drawResult.forEach((n, i) => fillSlot(i, n));
    addHistory(mainResult, specialResult);
    renderBalls();
    busy = false;
    drawBtn.disabled = false;
    drawBtn.textContent = "攪 珠";
  }

  function doDraw() {
    if (busy) return;
    // If the user starts again immediately, discard any still-fading exit balls.
    exitingBalls.length = 0;
    busy = true;
    drawBtn.disabled = true;
    drawResult = drawSeven();
    mainResult = drawResult.slice(0, 6);
    specialResult = drawResult[6];
    renderTrack();
    startDirection = drawCount % 2 === 0 ? 1 : -1;

    if (reduceMotion) {
      completeWithoutMotion();
      return;
    }

    const present = new Set(balls.map(b => b.num));
    const missing = Array.from({ length: 49 }, (_, i) => i + 1).filter(n => !present.has(n));
    if (missing.length) startRefill(missing);
    else beginRoundOne();
    startLoop();
  }

  function resizeWorld() {
    const next = measureWorld();
    const previous = world;
    if (Math.abs(next.scale - previous.scale) < 0.001) return;
    const ratio = next.scale / previous.scale;
    world = next;
    for (const b of balls) {
      b.x = world.cx + (b.x - previous.cx) * ratio;
      b.y = world.cy + (b.y - previous.cy) * ratio;
      b.vx *= ratio;
      b.vy *= ratio;
    }
    exitingBalls.length = 0;
    setupCanvas();
    renderBalls();
  }

  window.addEventListener("resize", resizeWorld, { passive: true });
  setupCanvas();
  renderTrack();
  initTumbler(); // All 49 balls begin in a genuinely still, settled pile.
  renderBalls();
  drawBtn.addEventListener("click", doDraw);
</script>
</body>
</html>
